[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttwall"
version = "0.1.0"
description = "Config-driven Python CLI for TeamTalk login and messaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "configobj>=5.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
ttwall = "ttwall.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
